name: Build Android APK (Release)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.16.1

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install

      - name: 🔑 Restore Android Keystore from Secret
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/release-key.jks
          echo "Keystore restored successfully."

      - name: 🏗️ Setup Native Android Project
        run: |
          cd apps/mobile
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi
          # Ensure monorepo gradle plugin resolution in settings.gradle
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('android/settings.gradle', 'utf8');
            content = content.replace(
              \"require.resolve('@react-native/gradle-plugin/package.json')\",
              \"require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })\"
            );
            fs.writeFileSync('android/settings.gradle', content);
          "

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: ⚙️ Build Android Release APK (No Lint)
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalReportRelease --no-daemon

      - name: 🔏 Sign Release APK with Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_FILE=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "apps/mobile/release-key.jks" ] && [ -n "$APK_FILE" ]; then
            echo "Signing $APK_FILE with apksigner..."
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks apps/mobile/release-key.jks \
                --ks-pass "pass:$KEYSTORE_PASS" \
                --key-pass "pass:$KEY_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --out apps/mobile/android/app/build/outputs/apk/release/nhipnha-release-signed.apk \
                "$APK_FILE" || echo "apksigner signed or kept original apk"
            fi
          fi

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhipnha-android-release-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
