name: Build Android APK (Release)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: ⚡ Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile=false

      - name: 🔑 Restore Android Keystore from Secret
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/release-key.jks
          echo "Keystore restored successfully."

      - name: 🏗️ Expo Prebuild Cross-Platform (Android & iOS)
        run: |
          CI=1 pnpm --filter @nhipnha/mobile run prebuild:all

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: ⚙️ Build Android Release APK (No Lint)
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon

      - name: 🔏 Sign Release APK with Keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_FILE=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "apps/mobile/release-key.jks" ] && [ -n "$APK_FILE" ]; then
            echo "Signing $APK_FILE with apksigner..."
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks apps/mobile/release-key.jks \
                --ks-pass "pass:$KEYSTORE_PASS" \
                --key-pass "pass:$KEY_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --out apps/mobile/android/app/build/outputs/apk/release/nhipnha-release-signed.apk \
                "$APK_FILE" || echo "apksigner signed or kept original apk"
            fi
          fi

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhipnha-android-release-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: 🚀 Release APK to GitHub Release 'dev'
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: dev
          name: "Nhịp Nhà (Home Rhythm) - Dev Build"
          body: |
            ## 📱 Nhịp Nhà – Gần nhau dù cách xa (Home Rhythm)
            **RMIT University Vietnam • RBPC 2026 (SDG 3, 4, 8)**

            - **Commit**: `${{ github.sha }}`
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **Language Support**: English & Tiếng Việt (System Default / In-app selectable)
            - **Accessibility**: Nút bấm $\ge 56\text{px}$, font chữ lớn, Zero-Type QR Pairing.
          files: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
