name: iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch: {}

env:
  INSTALL_URL: https://huanhoahongso3-collab.github.io/autosignipacert/xanhtantay/
  IPA_NAME: nhipnha-signed.ipa
  RELEASE_TAG: ios-latest

jobs:
  build:
    name: Build & Sign IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install Apple certificate and provisioning profile (Skip if not found)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::notice::Apple signing secrets not found. Skipping manual signing setup and building unsigned IPA."
            BUNDLE_ID=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
            echo "HAS_SIGNING=false" >> $GITHUB_ENV
            echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-build.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "github-actions-pwd" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "github-actions-pwd" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -t cert -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions-pwd" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw $RUNNER_TEMP/profile.plist || plutil -extract Entitlements.com.apple.developer.team-identifier raw $RUNNER_TEMP/profile.plist)
          UUID=$(plutil -extract UUID raw $RUNNER_TEMP/profile.plist)
          PROFILE_NAME=$(plutil -extract Name raw $RUNNER_TEMP/profile.plist)
          FULL_APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/profile.plist)
          BUNDLE_ID="${FULL_APP_ID#*.}"
          # Wildcard profile: keep the bundle id from app.json. Explicit profile: the app must
          # use exactly that id, so it's written into app.json before prebuild below.
          if [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
          fi
          echo "Profile: $PROFILE_NAME ($UUID), team $TEAM_ID, bundle $BUNDLE_ID"

          echo "HAS_SIGNING=true" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile=false

      - name: Match bundle id to provisioning profile
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.ios.bundleIdentifier = process.env.BUNDLE_ID;
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Prebuild iOS project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://nhipnha.vercel.app/api' }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: npx expo prebuild --platform ios --clean

      # expo-notifications adds aps-environment; manual signing fails unless it matches the profile.
      # Use the profile's value, or drop push entirely when the profile has no Push Notifications capability.
      - name: Match push entitlement to provisioning profile
        working-directory: apps/mobile/ios
        run: |
          for ENT in */*.entitlements; do
            [ -f "$ENT" ] || continue
            if [ "$HAS_SIGNING" = "true" ] && APS=$(plutil -extract Entitlements.aps-environment raw "$RUNNER_TEMP/profile.plist" 2>/dev/null); then
              plutil -replace aps-environment -string "$APS" "$ENT"
              echo "$ENT: aps-environment=$APS"
            else
              plutil -remove aps-environment "$ENT" 2>/dev/null || true
              echo "::warning::Provisioning profile not present or has no Push Notifications capability; removing aps-environment."
            fi
          done

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build archive (Signed or Unsigned fallback)
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building $WORKSPACE / $SCHEME (HAS_SIGNING=$HAS_SIGNING)"
          set -o pipefail

          if [ "$HAS_SIGNING" = "true" ]; then
            xcodebuild clean archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
              PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
              SUPPORTED_PLATFORMS="iphoneos" \
              EXCLUDED_ARCHS="x86_64 i386" \
              | xcbeautify --quiet --renderer github-actions
          else
            xcodebuild clean archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              SUPPORTED_PLATFORMS="iphoneos" \
              EXCLUDED_ARCHS="x86_64 i386" \
              | xcbeautify --quiet --renderer github-actions
          fi

      - name: Export IPA
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROVISIONING_PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
              -exportPath $RUNNER_TEMP/exported_ipa

            mv $RUNNER_TEMP/exported_ipa/*.ipa "$RUNNER_TEMP/$IPA_NAME"
          else
            echo "Packaging unsigned .xcarchive into .ipa payload..."
            mkdir -p "$RUNNER_TEMP/Payload"
            cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
            cd "$RUNNER_TEMP"
            zip -qry "$RUNNER_TEMP/$IPA_NAME" Payload
          fi

          ls -la "$RUNNER_TEMP/$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhipnha-signed-ipa
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}
          retention-days: 1

  release:
    name: Publish rolling iOS prerelease
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nhipnha-signed-ipa
          path: release_artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nhịp Nhà — iOS (mới nhất)
          body: |
            ### 🚀 iOS Build Details
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Changelog:** ${{ github.event.head_commit.message }}

            ### 🔗 Liên kết cài đặt trực tuyến (Mở bằng Safari trên iPhone)
            Nhấn vào link dưới đây để đến trang cài đặt ứng dụng dành cho thiết bị thật:

            👉 **[BẤM VÀO ĐÂY ĐỂ CÀI ĐẶT](${{ env.INSTALL_URL }})**
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: release_artifacts/${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
