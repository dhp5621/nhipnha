name: iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch: {}

env:
  IPA_NAME: nhipnha-unsigned.ipa
  RELEASE_TAG: ios-latest

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Install pnpm
        run: npm install -g pnpm@12.16.1

      - name: 🛠️ Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # Apple signing commented out as requested - producing unsigned IPA for now
      # - name: Install Apple certificate and provisioning profile
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     ...

      - name: 🐘 Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: 📦 Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile=false

      - name: 🏗️ Prebuild iOS Project & Install Pods
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://nhipnha.vercel.app/api' }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install --repo-update

      - name: 🎨 Install xcbeautify
        run: brew install xcbeautify

      - name: ⚙️ Build Unsigned Archive
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building unsigned $WORKSPACE / $SCHEME"
          set -o pipefail

          xcodebuild clean archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SUPPORTED_PLATFORMS="iphoneos" \
            EXCLUDED_ARCHS="x86_64 i386" \
            | xcbeautify --quiet --renderer github-actions

      - name: 📦 Package Unsigned IPA
        run: |
          echo "Packaging unsigned .xcarchive into .ipa payload..."
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$RUNNER_TEMP/$IPA_NAME" Payload
          ls -la "$RUNNER_TEMP/$IPA_NAME"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhipnha-unsigned-ipa
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}
          retention-days: 14

  release:
    name: Publish Unsigned iOS Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nhipnha-unsigned-ipa
          path: release_artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nhịp Nhà — iOS Unsigned (mới nhất)
          body: |
            ### 📱 Nhịp Nhà (Home Rhythm) — iOS Unsigned IPA
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Type:** Unsigned IPA (Tương thích Sideloadly / AltStore / TrollStore / Ký chứng chỉ doanh nghiệp)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: release_artifacts/${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
